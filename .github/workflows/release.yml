# On every push to main whose version (nanger/__init__.py) has no release yet:
# build the .deb, create the GitHub release (and the v<version> tag), publish the
# signed apt repository to GitHub Pages (branch gh-pages) and, if configured, the AUR.
#
# Optional secrets: APT_GPG_PRIVATE_KEY (+ APT_GPG_PASSPHRASE), AUR_SSH_PRIVATE_KEY
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.v.outputs.new }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: v
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' nanger/__init__.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: steps.v.outputs.new == 'yes'
        run: |
          python3 -m compileall -q nanger
          for arch in all amd64 arm64 armhf; do
            sh packaging/debian/build-deb.sh "${{ steps.v.outputs.version }}" "$arch"
          done
          git archive --format=tar.gz --prefix="nanger-${{ steps.v.outputs.version }}/" \
            -o "dist/nanger-${{ steps.v.outputs.version }}.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS)

      - name: GitHub release
        if: steps.v.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "nanger ${{ steps.v.outputs.version }}" \
            --notes-file <( { sed -n '/^## /{p;:a;n;/^## /q;p;ba}' CHANGELOG.md | sed '1d'
              printf '\n### Downloads\n\n| Device | File |\n|---|---|\n| PC (Intel/AMD, 64-bit) | `nanger_%s_amd64.deb` |\n| ARM 64-bit (Raspberry Pi 3/4/5, Apple-silicon VMs, ARM servers) | `nanger_%s_arm64.deb` |\n| ARM 32-bit (older Raspberry Pi OS) | `nanger_%s_armhf.deb` |\n| Any CPU | `nanger_%s_all.deb` |\n\nInstall: `sudo apt install ./nanger_*.deb`\n' "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.version }}"; } )

      - name: Point the Homebrew formula at the new tag
        if: steps.v.outputs.new == 'yes'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "s|tag: \"v[0-9.]*\"|tag: \"v$VERSION\"|" Formula/nanger.rb
          if ! git diff --quiet Formula/nanger.rb; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add Formula/nanger.rb
            git commit -qm "Homebrew formula: v$VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Check optional secrets
        id: sec
        env:
          K1: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          K2: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$K1" ] && echo "apt=yes" >> "$GITHUB_OUTPUT" || echo "apt=no" >> "$GITHUB_OUTPUT"
          [ -n "$K2" ] && echo "aur=yes" >> "$GITHUB_OUTPUT" || echo "aur=no" >> "$GITHUB_OUTPUT"

      - name: Signed apt repository to GitHub Pages
        if: steps.v.outputs.new == 'yes' && steps.sec.outputs.apt == 'yes'
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          echo "$GPG_KEY" | gpg --batch --import
          KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          printf '%s' "$GPG_PASS" > /tmp/pp
          export GPG_OPTS="--pinentry-mode loopback --passphrase-file /tmp/pp"
          # keep older versions: start from the current gh-pages content
          mkdir -p /tmp/debs
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add /tmp/pages FETCH_HEAD
            cp /tmp/pages/pool/main/*.deb /tmp/debs/ 2>/dev/null || true
          fi
          cp dist/*_all.deb /tmp/debs/   # the repository serves the universal package
          sh packaging/apt/build-repo.sh /tmp/debs /tmp/site "$KEY"
          cp packaging/apt/index.html /tmp/site/index.html
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "apt repository ${{ steps.v.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Update the AUR package
        if: steps.v.outputs.new == 'yes' && steps.sec.outputs.aur == 'yes'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/nanger.git /tmp/aur || git init -q /tmp/aur
          git -C /tmp/aur remote get-url origin >/dev/null 2>&1 || \
            git -C /tmp/aur remote add origin ssh://aur@aur.archlinux.org/nanger.git
          VERSION="${{ steps.v.outputs.version }}"
          sed "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD
          sed "s/pkgver = .*/pkgver = $VERSION/; s/#tag=v[0-9.]*/#tag=v$VERSION/" packaging/aur/.SRCINFO > /tmp/aur/.SRCINFO
          cd /tmp/aur
          git config user.name "Speederhun"; git config user.email "noreply@github.com"
          git checkout -q -B master          # the AUR only accepts the master branch
          git add -A
          git diff --cached --quiet || git commit -qm "Update to $VERSION"
          git push origin master

  # pacman repository: nanger.db + the package are release assets of the fixed tag "arch-repo",
  # so Arch users add one [nanger] section to /etc/pacman.conf and `pacman -Syu` updates nanger.
  arch:
    needs: release
    if: needs.release.outputs.new == 'yes' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm git github-cli python
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the package
        run: |
          git config --global --add safe.directory '*'
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd packaging/arch && makepkg -f --noconfirm'
      - name: Publish the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packaging/arch
          rm -rf /tmp/repo && mkdir /tmp/repo
          cp nanger-*.pkg.tar.zst /tmp/repo/
          cd /tmp/repo
          repo-add nanger.db.tar.gz nanger-*.pkg.tar.zst
          rm -f nanger.db nanger.files          # repo-add made them symlinks to the .tar.gz
          cp nanger.db.tar.gz nanger.db
          cp nanger.files.tar.gz nanger.files
          cd "$GITHUB_WORKSPACE"
          gh release view arch-repo >/dev/null 2>&1 || \
            gh release create arch-repo --title "Arch Linux pacman repository" \
              --notes "Automatic pacman repository (do not download by hand). Add to /etc/pacman.conf: see the README."
          # drop the packages of older versions, then upload the new files
          for old in $(gh release view arch-repo --json assets --jq '.assets[].name' | grep '\.pkg\.tar\.zst$' || true); do
            gh release delete-asset arch-repo "$old" -y || true
          done
          gh release upload arch-repo /tmp/repo/nanger.db /tmp/repo/nanger.files \
            /tmp/repo/nanger-*.pkg.tar.zst --clobber
