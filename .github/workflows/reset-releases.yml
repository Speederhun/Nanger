# One-off: delete every old release and v* tag except the given one (and arch-repo).
name: reset-releases
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep (e.g. v1.0.0)"
        required: true
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/releases" --paginate --jq '.[]|"\(.id) \(.tag_name)"' | while read -r id tag; do
            case "$tag" in "$KEEP"|arch-repo) continue;; esac
            echo "delete release $tag"; gh api -X DELETE "repos/$REPO/releases/$id" || true
          done
          gh api "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' | while read -r ref; do
            tag="${ref#refs/tags/}"
            [ "$tag" = "$KEEP" ] && continue
            echo "delete tag $tag"; gh api -X DELETE "repos/$REPO/git/$ref" || true
          done
