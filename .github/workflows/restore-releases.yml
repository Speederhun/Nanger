# One-off: re-create the old GitHub releases (each rebuilt from its own commit) and drop v1.0.0.
name: restore-releases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit arch-repo --notes "Automatic pacman repository (do not download by hand). Add to /etc/pacman.conf: see the README."
