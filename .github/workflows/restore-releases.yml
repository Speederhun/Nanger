# One-off: re-create the old GitHub releases (each rebuilt from its own commit) and drop v1.0.0.
name: restore-releases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          while read -r ver sha; do
            [ -n "$ver" ] || continue
            if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver exists"; continue; fi
            git checkout -qf "$sha" && git clean -fdxq
            mkdir -p dist
            for arch in all amd64 arm64 armhf; do
              sh packaging/debian/build-deb.sh "$ver" "$arch" >/dev/null 2>&1 || sh packaging/debian/build-deb.sh >/dev/null 2>&1 || true
            done
            git archive --format=tar.gz --prefix="nanger-$ver/" -o "dist/nanger-$ver.tar.gz" "$sha"
            sed -n "/^## $ver\\b/{p;:a;n;/^## /q;p;ba}" CHANGELOG.md | sed '1d' > /tmp/notes.md
            [ -s /tmp/notes.md ] || echo "nanger $ver" > /tmp/notes.md
            gh release create "v$ver" dist/* --target "$sha" --title "nanger $ver" --notes-file /tmp/notes.md --latest=false \
              && echo "restored v$ver" || echo "FAILED v$ver"
            rm -rf dist
          done <<'LIST'
            1.2.0 a07ddcf086219553e064a747751faa4917d311e7
            1.2.1 bf216a42c2fb1582c9860651a5a32b0eab911357
            1.3.0 238cfe0d017e8a06774ae86d2bf2de9c707a8c87
            1.4.0 75074eda78c9a069b0b84db2aa36ee9a71dac7c7
            1.5.0 485aa332824cf89973aadb3f92dbe6ecab0a10e8
            1.6.0 357dc1882ede760c64789e83f496def18e1ed138
            1.7.0 a4a7a12efe9f07fc8358b5542ffb851ea1fa484a
            1.8.0 b1f55a22aa5bd05d5a3a9054f86b362a587864c2
            1.8.1 37dad40bb1f0da30a42f6d178f876b2f6e5b1795
            1.8.2 8a7042c5c62c7f6f6d26dc9e04dd155a3e16cf41
            1.9.0 bdf31ad430bc8c9c9bee4d1694dbf7b620692d86
            1.9.1 b17ac105e883c9eb4e71311adbf2c79d0b66b8f7
            1.10.0 63980f52fc63afda0d2a8bed4fa8c93d3d1078a9
            1.10.1 856ea16e562edc77942c4a952dcdef617c7081b7
            1.11.0 47b208c1e6fe2abe952dd1d458d3ad9b87e5451a
            1.11.1 48bb9d7ab13bde521b6dfbcfb81db639e15b6124
            1.11.2 6f544cc4d8232b57e2900a3eb4bd951057f8e6e4
            1.12.0 7baae6e5ce293bad79b16d4c29ef7786a0ad6e27
            1.12.1 6845698b202154b25775ead81ee3eac80db0df3b
          LIST
          git checkout -qf "$GITHUB_SHA"
          # drop the temporary v1.0.0 release and tag
          id="$(gh api "repos/$REPO/releases/tags/v1.0.0" --jq .id 2>/dev/null || true)"
          [ -n "$id" ] && gh api -X DELETE "repos/$REPO/releases/$id" || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/v1.0.0" || true
